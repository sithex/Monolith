[[set]]
identifier = "island-commands"
description = "Every app command the island window may call. test_probe_reply answers `unsupported` unless the test hooks are enabled (--test-instance and HERMES_ISLAND_TEST=1)."
permissions = [
  "allow-launcher-get",
  "allow-launcher-command",
  "allow-layout-get",
  "allow-layout-command",
  "allow-layout-geometry",
  "allow-visual-get",
  "allow-appearance-set",
  "allow-island-bootstrap",
  "allow-island-dispatch",
  "allow-island-report-geometry",
  "allow-settings-get",
  "allow-settings-patch",
  "allow-palette-get",
  "allow-hermes-theme-sync",
  "allow-notch-scheme-set",
  "allow-terminal-attach",
  "allow-terminal-input",
  "allow-terminal-resize",
  "allow-terminal-restart",
  "allow-terminal-ack",
  "allow-system-stats",
  "allow-ai-usage",
  "allow-ai-connect",
  "allow-voice-command",
  "allow-notifications-list",
  "allow-notifications-dismiss",
  "allow-notifications-clear",
  "allow-clipboard-list",
  "allow-clipboard-get",
  "allow-clipboard-copy",
  "allow-clipboard-pin",
  "allow-clipboard-delete",
  "allow-clipboard-clear",
  "allow-clipboard-set-paused",
  "allow-weather-refresh",
  "allow-weather-geocode",
  "allow-media-control",
  "allow-media-set-visible",
  "allow-timer-get",
  "allow-timer-command",
  "allow-scratchpad-get",
  "allow-scratchpad-command",
  "allow-downloads-get",
  "allow-downloads-open",
  "allow-calendar-get",
  "allow-calendar-command",
  "allow-calendar-refresh",
  "allow-calendar-set-subscription",
  "allow-brightness-get",
  "allow-brightness-command",
  "allow-agents-get",
  "allow-mixer-get",
  "allow-mixer-command",
  "allow-toggles-get",
  "allow-toggles-command",
  "allow-updates-get",
  "allow-updates-refresh",
  "allow-tiles-get",
  "allow-tiles-command",
  "allow-test-probe-reply",
]
