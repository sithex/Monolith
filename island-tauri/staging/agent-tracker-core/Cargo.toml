[package]
name = "agent-tracker-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Pure core for the Hermes Island Agent run tracker app (SPEC §0.5 item 8): classifies `sessions` table rows (read-only from ~/.hermes/state.db) into Running/Stale/Finished states, builds live chips for running Hermes agent sessions and emits state-transition events. Time is always an injected parameter. No IO, no network, no threads, no clock, never panics."
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
