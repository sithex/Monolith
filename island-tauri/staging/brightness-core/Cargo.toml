[package]
name = "brightness-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Pure core for the Hermes Island Phase 6b Controls app (SPEC §0.5 Apps bullet, §8 Phase 6b): display model for KDE PowerDevil ScreenBrightness, percent <-> raw conversion, slider-drag coalescing, and D-Bus method-call request builders. The Tauri actor talks to PowerDevil over zbus and passes decoded values here; this crate never does IO, never runs anything."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
