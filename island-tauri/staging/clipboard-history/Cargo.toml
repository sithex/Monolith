[package]
name = "clipboard-history"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Pure clipboard history store for Hermes Island (SPEC §3.3): platform-free, unit-tested."
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
regex = "1"
base64 = "0.22"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
