[package]
name = "launcher-arrange-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Pure core for SPEC §0.5 \"Design direction\" (App launcher + Launcher edit mode): the phone-style jiggle edit session for the Hermes Island app grid. Decides the edit state machine (visible/hidden, moves, locks, cancel/commit, reconcile); the Tauri actor applies the commit to the module registry. No IO, no network, no threads, no clock, never panics."
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
