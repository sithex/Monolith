[package]
name = "module-registry"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Pure, versioned Island module settings registry with atomic imports and flat-settings migration"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
