[package]
name = "mpris-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Pure MPRIS playback-state core for the Hermes Island 'Now playing' row (SPEC §3.5) and Phase 6 lyrics timing: no IO, no network, no threads, no clock, never panics."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
