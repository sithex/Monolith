[package]
name = "scratchpad-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Pure core for the Hermes Island Phase 6b Scratchpad app (SPEC §0.5, §8): plain-text notes in the data dir with debounced atomic saves. Decides what to write and when; the Tauri actor does the file IO. No IO, no network, no threads, no clock, never panics."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
