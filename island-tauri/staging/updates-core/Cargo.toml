[package]
name = "updates-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Pure core for the Hermes Island package-update badge (SPEC §0.5 item 12): parses `checkupdates` (pacman-contrib) and `paru -Qua` stdout into an update list, classifies reboot-needing packages, and computes the badge state and check schedule. The Tauri actor runs the commands; this crate never runs anything. No IO, no network, no threads, no clock, never panics."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
